<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>留痕 · 个人记录反馈系统</title>
<meta name="description" content="纯记录、零目标压力：随手记一笔，自动写入本地文件并多端同步。">
<meta name="theme-color" content="#FAF9F6">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="留痕">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FAF9F6; --card:#FFFEFB; --ink:#1C1A17; --body:#3D3A34;
  --gray:#6F6858; --faint:#A69D8C; --mist:#C9C2B2;
  --line:#EBE5D8; --line2:#F0EBDF; --bd:#DFD9CC;
  --green:#4A7051; --red:#C0502C; --edit-bg:#FBF6E9;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC',serif;
  --sans:'Noto Sans SC',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
a{color:#33587A;text-decoration:none} a:hover{color:var(--ink)}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.mono{font-family:var(--mono)}
.serif{font-family:var(--serif)}

/* ---------- app frame ---------- */
#app{display:flex;min-height:100vh;min-height:100dvh}
#sidebar{width:212px;flex-shrink:0;border-right:1px solid var(--line);padding:22px 16px 18px;
  display:flex;flex-direction:column;position:sticky;top:0;height:100vh;height:100dvh}
.logo{padding:2px 10px 20px}
.logo b{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:.08em;display:block}
.logo span{font-size:11px;color:var(--faint);margin-top:3px;letter-spacing:.22em;display:block}
#nav{display:flex;flex-direction:column;gap:2px}
#nav button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;
  padding:9px 12px;border-radius:8px;color:var(--gray);font-size:13.5px}
#nav button:hover{background:var(--line2)}
#nav button.on{background:var(--ink);color:var(--paper);font-weight:600}
#nav button .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
#nav button.on .n{color:inherit;opacity:.55}
#side-foot{border-top:1px solid var(--line);padding:14px 4px 0;display:flex;flex-direction:column;gap:9px;cursor:pointer}
#side-foot:hover .save-sub{color:var(--gray)}
.save-line{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--green)}
.save-line .dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
.save-line.err{color:var(--red)} .save-line.err .dot{background:var(--red)}
.save-line.busy{color:var(--gray)} .save-line.busy .dot{background:var(--mist)}
.save-sub{font-size:11px;color:var(--faint);line-height:1.7}
.btn{border:1px solid var(--bd);border-radius:8px;padding:7px 14px;text-align:center;font-size:12px;color:var(--gray);background:var(--card)}
.btn:hover{border-color:var(--mist);color:var(--ink)}
.btn.dark{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.btn.dark:hover{opacity:.88;color:var(--paper)}

#mainwrap{flex:1;min-width:0;display:flex;justify-content:center}
#main{width:100%;max-width:1120px;padding:30px 36px 60px}

/* ---------- shared ---------- */
.page-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.page-title{font-family:var(--serif);font-weight:900;font-size:28px;line-height:1.2}
.page-title small{font-size:15px;font-weight:700;color:var(--gray)}
.h-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{font-size:12.5px;color:var(--gray);border:1px solid var(--bd);border-radius:999px;padding:5px 14px;background:transparent}
.pill b{font-family:var(--mono);font-weight:600;color:var(--ink)}
.mnav{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--gray)}
.mnav button{color:var(--faint);font-size:16px;padding:0 4px;line-height:1}
.mnav button:hover{color:var(--ink)}
.mnav b{font-weight:600;color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 13px;border-radius:999px;border:1px solid var(--bd);color:var(--gray);font-size:12px;background:transparent}
.chip .cdot{width:6px;height:6px;border-radius:50%}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
.chip.on-c{color:var(--paper);font-weight:600}
.chip.add{border-style:dashed;color:var(--faint)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.dot8{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot7{width:7px;height:7px;border-radius:50%;display:inline-block;flex-shrink:0}
.sec-label{font-size:12px;color:var(--faint);letter-spacing:.12em}
.empty{padding:28px 12px;text-align:center;color:var(--faint);font-size:13px;line-height:1.9}
input.line,select.line{border:none;border-bottom:1px solid var(--bd);background:transparent;padding:8px 2px;font-size:14px;outline:none;border-radius:0;width:100%}
input.line:focus,select.line:focus{border-bottom-color:var(--ink)}

/* ---------- today ---------- */
.today-cols{display:flex;gap:32px;align-items:flex-start}
.today-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.today-rail{width:272px;flex-shrink:0;display:flex;flex-direction:column;gap:16px}
.qcard{background:var(--card);border:1.5px solid var(--ink);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.qrow{display:flex;gap:10px;align-items:flex-end}
.qnote{flex:1;min-width:0}
.qmin{width:110px} .qmin input{font-family:var(--mono)}
.qmetric{width:150px}
.qbtn{background:var(--ink);color:var(--paper);border-radius:9px;padding:9px 22px;font-size:13.5px;font-weight:600;flex-shrink:0}
.qhint{font-size:11.5px;color:var(--faint)}
.tlist{display:flex;flex-direction:column}
.tlist-head{font-size:12px;color:var(--faint);letter-spacing:.12em;padding:4px 2px 10px}
.trow{display:grid;grid-template-columns:56px 88px 1fr 200px 76px;gap:12px;align-items:center;padding:13px 12px;border-top:1px solid var(--line2);cursor:pointer}
.trow:hover{background:var(--line2)}
.trow .t{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.trow .cat{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--gray)}
.trow .note{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .metric{font-size:12.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .min{font-family:var(--mono);font-size:13px;text-align:right}
.trow-more{border-top:1px solid var(--line2);padding:13px 12px;font-size:12.5px;color:var(--faint);text-align:left;width:100%}
.trow-more:hover{color:var(--gray)}
.railcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.railcard h4{margin:0 0 14px;font-size:12px;color:var(--faint);letter-spacing:.12em;font-weight:400}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wk .d{display:flex;flex-direction:column;align-items:center;gap:7px;padding:8px 0 10px;border-radius:8px;border:1px solid var(--line2)}
.wk .d .lb{font-size:10.5px;color:var(--faint)}
.wk .d .num{font-family:var(--mono);font-size:13px;font-weight:600}
.wk .dots,.cal .dots{display:flex;gap:3px;min-height:5px;flex-wrap:wrap;justify-content:center}
.wk .dots i{width:5px;height:5px;border-radius:50%;display:block}
.mstat{display:flex;align-items:center;gap:9px;font-size:13px;padding:5px 0}
.mstat .nm{width:42px;color:var(--gray);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mstat b{font-family:var(--mono);font-weight:600}
.mstat .hrs{font-family:var(--mono);font-size:12px;color:var(--faint)}
.rail-note{font-size:11.5px;color:var(--faint);border-top:1px solid var(--line2);padding-top:11px;line-height:1.7;margin-top:8px}
.rail-note a{color:#33587A;text-decoration:none;cursor:pointer}

/* ---------- table ---------- */
.tbl{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;margin-top:16px}
.tr{display:grid;grid-template-columns:104px 60px 92px 1fr 64px 190px 44px;gap:0 12px;padding:11px 18px;border-bottom:1px solid var(--line2);align-items:center}
.tr.head{font-size:11.5px;color:var(--faint);letter-spacing:.08em;border-bottom:1px solid var(--line)}
.tr .c-date{font-family:var(--mono);font-size:12.5px;color:var(--gray)} .tr .c-date .wd{color:var(--faint)}
.tr .c-time{font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.tr .c-cat{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gray);min-width:0}
.tr .c-cat .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .c-note{font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .c-min{font-family:var(--mono);font-size:13px}
.tr .c-metric{font-size:12.5px;color:var(--faint);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .c-menu{font-size:14px;color:var(--mist);text-align:center;padding:0 6px;border-radius:6px}
.tr .c-menu:hover{color:var(--red)}
.tr.row{cursor:pointer} .tr.row:hover{background:var(--line2)}
.tr.editing{background:var(--edit-bg);cursor:default}
.tr.editing input,.tr.editing select{border:none;border-bottom:1px solid var(--ink);background:transparent;padding:3px 0;font-size:12.5px;outline:none;border-radius:0;width:100%;min-width:0}
.tr.editing input[type=date],.tr.editing input[type=time],.tr.editing input.e-min{font-family:var(--mono)}
.tr.editing input.e-note{font-size:13.5px}
.tr.editing .save{font-size:11.5px;color:var(--green);font-weight:600;text-align:center}
.tbl-foot{display:flex;justify-content:space-between;gap:10px;padding:12px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);flex-wrap:wrap}
.tbl-foot b{font-family:var(--mono);color:var(--gray);font-weight:500}
.d-sep{display:none}
input.search{border:1px solid var(--bd);border-radius:8px;padding:7px 14px;font-size:12.5px;width:190px;background:var(--card);outline:none}
input.search:focus{border-color:var(--mist)}

/* ---------- review ---------- */
.rv-stats{display:flex;gap:26px;padding:16px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.rv-stats .s{flex:1;min-width:110px}
.rv-stats .v{font-family:var(--mono);font-size:24px;font-weight:600}
.rv-stats .v small{font-size:14px;color:var(--faint);font-weight:400}
.rv-stats .k{font-size:12px;color:var(--faint);margin-top:2px}
.rv-stats .sep{width:1px;background:var(--line2)}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden;font-size:12.5px}
.seg button{padding:6px 16px;color:var(--gray)}
.seg button.on{background:var(--ink);color:var(--paper);font-weight:600}
.rv-cols{display:flex;gap:20px;align-items:stretch;margin-top:20px}
.rv-cal{flex:1.35;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.rv-side{width:316px;flex-shrink:0;display:flex;flex-direction:column;gap:12px}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:11px;color:var(--faint);text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;flex:1}
.cal .cell{border:1px solid var(--line2);background:var(--card);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between;min-height:62px}
.cal .cell.blank{border-color:transparent;background:transparent}
.cal .cell.today{border-color:var(--ink);background:var(--ink)}
.cal .cell .num{font-family:var(--mono);font-size:12.5px;font-weight:600}
.cal .cell.today .num{color:var(--paper)}
.cal .cell.future .num{color:var(--mist)}
.cal .dots{min-height:6px;justify-content:flex-start}
.cal .dots i{width:6px;height:6px;border-radius:50%;display:block}
.catcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:9px}
.catcard .top{display:flex;align-items:center;gap:8px}
.catcard .top b{font-size:13.5px}
.catcard .top .n{font-family:var(--mono);font-size:13px;margin-left:auto}
.catcard .bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.catcard .bar i{display:block;height:100%}
.catcard .sub{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint)}
.rv-bottom{display:flex;gap:20px;margin-top:20px}
.chart-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.bars{display:flex;align-items:flex-end;gap:14px;height:118px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .stack{width:100%;max-width:26px;display:flex;flex-direction:column-reverse;border-radius:4px 4px 2px 2px;overflow:hidden}
.bars .tick{font-size:10px;color:var(--faint);height:12px;white-space:nowrap}
.share-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line2)}
.share-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--gray);padding:2px 0}
.share-row .pc{font-family:var(--mono);margin-left:auto}
.share-row .hh{font-family:var(--mono);color:var(--faint);width:52px;text-align:right}
.mini-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.mini-m .mt{font-size:11.5px;color:var(--gray);font-weight:600;margin-bottom:6px}
.mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini-grid i{aspect-ratio:1;border-radius:3px;background:var(--line2);display:block}
.mini-grid i.blank{background:transparent}
.mini-grid i.today{outline:1.5px solid var(--ink);outline-offset:1px}

/* ---------- categories ---------- */
.cat-list{display:flex;flex-direction:column;margin-top:6px}
.cat-row{display:flex;align-items:center;gap:14px;padding:14px 16px;border-top:1px solid var(--line2)}
.cat-row:first-child{border-top:none}
.swatch{width:22px;height:22px;border-radius:50%;border:2px solid var(--card);box-shadow:0 0 0 1px var(--bd);flex-shrink:0}
.cat-row .nm{font-size:14px;font-weight:600;cursor:text;padding:2px 4px;border-radius:4px}
.cat-row .nm:hover{background:var(--line2)}
.cat-row input.nm-in{border:none;border-bottom:1px solid var(--ink);background:transparent;font-size:14px;font-weight:600;outline:none;padding:2px 4px;width:120px}
.cat-row .meta{font-size:12px;color:var(--faint);font-family:var(--mono)}
.cat-row .del{margin-left:auto;color:var(--mist);font-size:16px;padding:4px 8px;border-radius:6px}
.cat-row .del:hover{color:var(--red)}
.palette{display:flex;gap:8px;flex-wrap:wrap;padding:10px 16px 14px 52px}
.palette button{width:20px;height:20px;border-radius:50%;border:2px solid transparent}
.palette button.on{border-color:var(--ink)}
.cat-add{padding:14px 16px;border-top:1px solid var(--line2);color:var(--faint);font-size:13px;text-align:left;width:100%}
.cat-add:hover{color:var(--gray)}

/* ---------- overlay / sheet ---------- */
#overlay{position:fixed;inset:0;background:rgba(28,26,23,.32);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
#overlay[hidden]{display:none}
#sheet{background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:0 24px 60px rgba(28,26,23,.18);
  width:100%;max-width:480px;max-height:86vh;max-height:86dvh;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
#sheet h3{font-family:var(--serif);font-weight:900;font-size:19px;margin:0 0 4px}
#sheet h5{font-size:11.5px;color:var(--faint);letter-spacing:.12em;font-weight:400;margin:22px 0 8px}
#sheet .frow{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
#sheet .frow label{font-size:11.5px;color:var(--faint)}
#sheet .hint{font-size:11.5px;color:var(--faint);line-height:1.8}
#sheet .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#sheet .status-ln{font-size:12px;color:var(--gray);line-height:1.8}
#sheet .x{position:sticky;float:right;top:0;color:var(--mist);font-size:18px;padding:2px 8px;margin:-6px -8px 0 0}
#sheet .x:hover{color:var(--ink)}
#sheet .dev{display:flex;justify-content:space-between;font-size:12px;color:var(--gray);padding:5px 0;border-bottom:1px solid var(--line2)}
#sheet .dev .tm{color:var(--faint);font-family:var(--mono);font-size:11px}
#sheet .danger{color:var(--red)}

/* ---------- mobile tab bar ---------- */
#tabbar{display:none}

/* ============ MOBILE ============ */
@media (max-width:920px){
  #sidebar{display:none}
  #main{padding:18px 16px calc(86px + env(safe-area-inset-bottom))}
  #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
    padding:10px 0 calc(12px + env(safe-area-inset-bottom));z-index:40}
  #tabbar button{flex:1;text-align:center;font-size:12px;color:var(--faint)}
  #tabbar button.on{font-weight:700;color:var(--ink)}
  .page-title{font-size:24px}
  .today-cols{flex-direction:column}
  .today-rail{width:100%}
  .qrow{flex-wrap:wrap}
  .qnote{flex-basis:100%}
  .qmin{width:96px} .qmetric{flex:1;width:auto}
  .h-tools{width:100%}
  input.search{flex:1;width:auto}
  /* today list rows */
  .trow{grid-template-columns:10px 1fr auto;grid-template-areas:"dot note min" "dot sub sub";gap:2px 10px;padding:11px 2px}
  .trow .t{display:none}
  .trow .cat{grid-area:dot} .trow .cat .txt{display:none}
  .trow .note{grid-area:note;font-size:13.5px;white-space:normal}
  .trow .metric{grid-area:sub;font-size:11px}
  .trow .metric::before{content:attr(data-t)" · ";font-family:var(--mono)}
  .trow .min{grid-area:min;font-size:12px}
  /* table rows become cards */
  .tr.head{display:none}
  .tr{grid-template-columns:10px 1fr auto auto;grid-template-areas:"dot note min menu" "dot sub sub menu";gap:2px 10px;padding:11px 12px}
  .tr .c-date{display:none}
  .tr .c-cat{grid-area:dot} .tr .c-cat .txt{display:none}
  .tr .c-note{grid-area:note;white-space:normal}
  .tr .c-time{grid-area:sub}
  .tr .c-time::after{content:" · "attr(data-metric);font-family:var(--sans);color:var(--faint)}
  .tr .c-metric{display:none}
  .tr .c-min{grid-area:min;text-align:right}
  .tr .c-menu{grid-area:menu}
  .d-sep{display:block;padding:14px 12px 6px;font-size:11.5px;color:var(--faint);letter-spacing:.08em;font-family:var(--mono);border-bottom:1px solid var(--line2)}
  .rv-cols{flex-direction:column}
  .rv-side{width:100%}
  .rv-bottom{flex-direction:column}
  .rv-stats{gap:14px;padding:14px 16px}
  .rv-stats .v{font-size:20px}
  .rv-stats .sep{display:none}
  .rv-stats .s{min-width:calc(50% - 14px)}
  .cal .cell{min-height:44px;padding:5px 6px;border-radius:8px;align-items:center;justify-content:center;gap:4px}
  .cal .cell .num{font-size:11.5px}
  .cal .dots{justify-content:center}
  .bars{gap:6px}
